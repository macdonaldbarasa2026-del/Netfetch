name: "Android CI & Release"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/libs.versions.toml', '**/**/*.gradle*', '**/gradle.properties') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          # The ubuntu-latest runner already ships with Android SDK at $ANDROID_HOME.
          # We configure Android API 35 (Android 15) for maximum broad compatibility across devices.
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Print environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify APK exists and is valid
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "Release APK found: $(ls -lh $APK_PATH)"
          echo "Debug APK found: $(ls -lh $DEBUG_APK)"
          file "$APK_PATH"
          unzip -t "$APK_PATH" > /dev/null && echo "Release APK integrity check: PASSED" || (echo "APK is corrupt!" && exit 1)
          unzip -t "$DEBUG_APK" > /dev/null && echo "Debug APK integrity check: PASSED" || (echo "Debug APK is corrupt!" && exit 1)

      - name: Prepare Release APK Packages
        run: |
          mkdir -p release-apk-dist
          # Production release APK (persistent keystore, v1 + v2 signing)
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch.apk
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch-v1.0.6.apk
          # Legacy version aliases (ensures any tapped previous version link downloads the latest APK)
          for v in v1.0.4 v1.0.3 v1.0.2 v1.0.1 v1.0.0; do
            cp app/build/outputs/apk/release/app-release.apk "release-apk-dist/NetFetch-$v.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "release-apk-dist/NetFetch-debug-$v.apk"
          done
          # Debug APK (universal install fallback)
          cp app/build/outputs/apk/debug/app-debug.apk release-apk-dist/NetFetch-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk-dist/NetFetch-debug-v1.0.6.apk
          # Generate SHA-256 checksums
          cd release-apk-dist
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          cd ..
          ls -la release-apk-dist

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFetch-release-apk
          path: release-apk-dist/*

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish or Update GitHub Release with Latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.6"

          cat > release-notes.md << 'RELNOTES'
          ## NetFetch v1.0.6 — Proxy Bandwidth Accounting Fix

          Turn your Android device into a high-performance Wi-Fi Direct repeater, tethering gateway, and local proxy server without requiring root access.

          ### What's New in v1.0.6
          - Prevented stale HTTP and SOCKS5 proxy callbacks from changing bandwidth totals after a restart.
          - Serialized bandwidth snapshots on the service main dispatcher and invalidated old sessions before resetting counters.

          ### 📦 Download & Install
          - **[NetFetch.apk (Production Release)](https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch.apk)**: Optimized, signed release APK.
          - **[NetFetch-debug.apk (Debug Build)](https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch-debug.apk)**: Unminified debug APK with maximum sideloading compatibility.
          - **NetFetch-v1.0.6.apk**: Version-pinned build for this release.

          ### 📋 Technical Details
          - Application ID: `com.netfetch.app`
          - Version: 1.0.6 (versionCode 106)
          - Minimum Android: API 24 (Android 7.0 Nougat)
          - Target Android: API 35 (Android 15)
          - Signing: Dual v1 + v2 signing enabled

          © 2026 Created by MacDonald | Powered by Mixfia
          RELNOTES

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION exists. Uploading latest APK assets..."
            gh release upload "$VERSION" release-apk-dist/* --clobber
          else
            echo "Creating release $VERSION with latest APK..."
            gh release create "$VERSION" release-apk-dist/* \
              --title "NetFetch $VERSION — Latest Official Release" \
              --notes-file release-notes.md \
              --latest
          fi

          echo "Verifying release assets..."
          gh release view "$VERSION" --json assets -q '.assets[].name'

          if gh release view "v1.0.0" > /dev/null 2>&1; then
            echo "Updating legacy v1.0.0 release with latest NetFetch.apk..."
            gh release upload "v1.0.0" release-apk-dist/NetFetch.apk --clobber || true
          fi

          echo "Release $VERSION published successfully."
          echo "Direct download URL: https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch.apk"
