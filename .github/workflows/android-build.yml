name: "Android CI & Release"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a production release from a matching version tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/libs.versions.toml', '**/**/*.gradle*', '**/gradle.properties') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Print environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify APK metadata and integrity
        id: apk_metadata
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "Release APK found: $(ls -lh "$APK_PATH")"
          echo "Debug APK found: $(ls -lh "$DEBUG_APK")"
          unzip -t "$APK_PATH" > /dev/null
          unzip -t "$DEBUG_APK" > /dev/null
          "$APKSIGNER" verify "$APK_PATH"

          PACKAGE_INFO=$("$AAPT" dump badging "$APK_PATH" | sed -n '1p')
          APP_ID=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$PACKAGE_INFO")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$PACKAGE_INFO")
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$PACKAGE_INFO")
          if [ "$APP_ID" != "com.netfetch.app" ] || [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "ERROR: Unexpected or missing APK metadata: $PACKAGE_INFO"
            exit 1
          fi
          echo "Verified package=$APP_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned production APK
        env:
          VERSION_NAME: ${{ steps.apk_metadata.outputs.version_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
              echo "ERROR: Production release requires tag v$VERSION_NAME; selected ref is $GITHUB_REF_NAME"
              exit 1
            fi
          fi

          mkdir -p release-apk-dist
          cp app/build/outputs/apk/release/app-release.apk "release-apk-dist/NetFetch-v$VERSION_NAME.apk"
          cd release-apk-dist
          sha256sum "NetFetch-v$VERSION_NAME.apk" > "NetFetch-v$VERSION_NAME.apk.sha256"
          cd ..
          ls -la release-apk-dist

      - name: Upload versioned production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFetch-release-apk
          path: release-apk-dist/*

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

  publish-release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tags and main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is part of main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download APK built in this workflow run
        uses: actions/download-artifact@v4
        with:
          name: NetFetch-release-apk
          path: release-apk-dist

      - name: Verify release package and create a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          APK="release-apk-dist/NetFetch-$TAG.apk"
          CHECKSUM="$APK.sha256"

          test "$TAG" = "v$VERSION"
          test -f "$APK"
          test -f "$CHECKSUM"
          (cd release-apk-dist && sha256sum -c "NetFetch-$TAG.apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists; refusing to replace or modify its assets."
            exit 1
          fi

          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --verify-tag \
            --title "NetFetch v$VERSION" \
            --notes "Production APK for NetFetch v$VERSION. Package: com.netfetch.app." \
            --latest

          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)
          EXPECTED=$(printf '%s\n' "NetFetch-$TAG.apk" "NetFetch-$TAG.apk.sha256" | sort)
          if [ "$ASSETS" != "$EXPECTED" ]; then
            echo "ERROR: Unexpected release asset list:"
            printf '%s\n' "$ASSETS"
            exit 1
          fi
