name: "Android CI & Release"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/libs.versions.toml', '**/**/*.gradle*', '**/gradle.properties') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          # The ubuntu-latest runner already ships with Android SDK at $ANDROID_HOME.
          # We only need to ensure the specific platforms and build-tools we require are present.
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "platforms dir not found"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "build-tools dir not found"
          # Accept licenses and install only what is missing
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Print environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify APK exists and is valid
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "APK found: $(ls -lh $APK_PATH)"
          file "$APK_PATH"
          unzip -t "$APK_PATH" > /dev/null && echo "APK integrity check: PASSED" || (echo "APK is corrupt!" && exit 1)

      - name: Prepare Release APK Packages
        run: |
          mkdir -p release-apk-dist
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch.apk
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch-v1.0.2.apk
          cd release-apk-dist
          sha256sum NetFetch.apk > NetFetch.apk.sha256
          sha256sum NetFetch-v1.0.2.apk > NetFetch-v1.0.2.apk.sha256
          cd ..
          ls -la release-apk-dist

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFetch-release-apk
          path: release-apk-dist/*

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish or Update GitHub Release with Latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.2"

          cat > release-notes.md << 'RELNOTES'
          ## NetFetch v1.0.2 — Stability Fix Release

          Turn your Android device into a high-performance Wi-Fi Direct repeater, tethering gateway, and local proxy server without requiring root access.

          ### 🛠️ What's Fixed in v1.0.2
          - **Build Fix:** Corrected escaped newline syntax error in HelpScreen.kt that was preventing the release APK from compiling.
          - **Preserved:** Kenya-compliant PayPal Hosted Button integration with explicit error when Button ID is missing.
          - **Preserved:** All security improvements — no PayPal secret keys in the APK.

          ### ✨ Features
          - **Enhanced Wi-Fi Direct & Hotspot Stability:** Clean lifecycle management and automatic P2P channel cleanup.
          - **Triple-Proxy Performance:** High-throughput HTTP (:8282), PAC auto-config (:8283), and SOCKS5 (:1080) relays.
          - **Packet Engine Optimizations:** Dynamic TCP MSS clamping, bounded memory pool, and zero-window throttling prevention.
          - **Universal Cross-Platform Support:** Windows, macOS, iOS, Android, and gaming consoles.

          ### 📦 Download & Install
          - **[NetFetch.apk](https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch.apk)**: Always links directly to the latest production APK.
          - **NetFetch-v1.0.2.apk**: Version-pinned build for this release.

          ### 📋 Technical Details
          - Application ID: `com.netfetch.app`
          - Version: 1.0.2 (versionCode 102)
          - Minimum Android: API 24 (Android 7.0 Nougat)
          - Target Android: API 36

          © 2026 Created by MacDonald | Powered by Mixfia
          RELNOTES

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION exists. Uploading latest APK assets..."
            gh release upload "$VERSION" release-apk-dist/* --clobber
          else
            echo "Creating release $VERSION with latest APK..."
            gh release create "$VERSION" release-apk-dist/* \
              --title "NetFetch $VERSION — Latest Official Release" \
              --notes-file release-notes.md \
              --latest
          fi

          echo "Verifying release assets..."
          gh release view "$VERSION" --json assets -q '.assets[].name'

          if gh release view "v1.0.0" > /dev/null 2>&1; then
            echo "Updating legacy v1.0.0 release with latest NetFetch.apk..."
            gh release upload "v1.0.0" release-apk-dist/NetFetch.apk --clobber || true
          fi

          echo "Release $VERSION published successfully."
          echo "Direct download URL: https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch.apk"
