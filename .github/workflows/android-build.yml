name: Android CI & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/libs.versions.toml', '**/**/*.gradle*', '**/gradle.properties') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Print environment
        run: |
          java -version
          sdkmanager --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Build Artifacts
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Prepare Release APK Packages
        run: |
          mkdir -p release-apk-dist
          # Copy signed release APK to canonical names
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch.apk
          cp app/build/outputs/apk/release/app-release.apk release-apk-dist/NetFetch-v1.0.1.apk
          # Generate SHA-256 checksums
          cd release-apk-dist
          sha256sum NetFetch.apk > NetFetch.apk.sha256
          sha256sum NetFetch-v1.0.1.apk > NetFetch-v1.0.1.apk.sha256
          cd ..
          ls -la release-apk-dist

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFetch-release-apk
          path: release-apk-dist/*

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish or Update GitHub Release with Latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.1"
          
          # Check if target release exists
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Uploading latest APK assets..."
            gh release upload "$VERSION" release-apk-dist/* --clobber
          else
            echo "Creating release $VERSION with latest APK..."
            gh release create "$VERSION" release-apk-dist/* \
              --title "NetFetch $VERSION — Latest Official Release" \
              --notes "## NetFetch $VERSION — Official Release

Turn your Android device into a high-performance Wi-Fi Direct repeater, tethering gateway, and local proxy server without requiring root access.

### ✨ What's New in This Release
- **Kenya-Compliant PayPal Support System:** Replaced broken profile links with compliant hosted button flow and zero app secrets.
- **Enhanced Wi-Fi Direct & Hotspot Stability:** Clean lifecycle management, connection tear-down, and automatic P2P channel cleanup.
- **Triple-Proxy Performance:** High-throughput HTTP (:8282), PAC auto-config (:8283), and SOCKS5 (:1080) relays.
- **Packet Engine Optimizations:** Dynamic TCP MSS clamping, bounded memory pool, and zero-window throttling prevention.
- **Universal Cross-Platform Support:** Windows, macOS, iOS, Android, and gaming consoles.

### 📦 Download & Install
- **[NetFetch.apk](https://github.com/macdonaldbarasa2026-del/Netfetch/releases/latest/download/NetFetch.apk)**: Always links directly to the latest production APK.
- **NetFetch-$VERSION.apk**: Version-pinned build.

© 2026 Created by MacDonald | Powered by Mixfia" \
              --latest
          fi

          # Also update legacy v1.0.0 release with latest NetFetch.apk so old link visitors receive the latest build
          if gh release view "v1.0.0" >/dev/null 2>&1; then
            echo "Updating legacy v1.0.0 release with latest NetFetch.apk..."
            gh release upload "v1.0.0" release-apk-dist/NetFetch.apk --clobber || true
          fi
